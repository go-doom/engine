name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: stable
        check-latest: true
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libx11-dev \
            libgl1-mesa-dev \
            libasound2-dev \
            libgles2-mesa-dev \
            libalut-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxxf86vm-dev
        go install golang.org/x/tools/cmd/deadcode@latest
    - name: Install doom wad
      run: wget https://github.com/Akbar30Bill/DOOM_wads/raw/refs/heads/master/doom1.wad
    - name: Run tests (64-bit)
      run: ./run_tests.sh
    - name: Run tests (32-bit)
      run: |
        export GOOS=linux
        export GOARCH=386
        ./run_tests.sh
    - name: deadcode
      # Police the pure-Go engine path for genuinely dead code. The entry
      # points must cover every real consumer of the engine API, otherwise
      # legitimately-used code is flagged: the deterministic-execution hooks
      # in seed.go are consumed by ./cmd/harvest-reference (and backend/
      # tamago), not by the webserver demo, and embedwad.DOOM1WAD is a
      # build-tagged stub exercised only by its own package test. We pass
      # those roots plus -test so deadcode builds the true reachability
      # graph. The cgo SDL/ebitengine demos are deliberately excluded here
      # (they don't build without SDL); they are covered by "Build example".
      run: |
        DEAD=$(deadcode -test ./example/webserver ./cmd/harvest-reference ./embedwad)
        if [ -n "$DEAD" ]; then
          echo "deadcode found the following unused code:"
          echo "$DEAD"
          exit 1
        fi
    - name: Build example
      run: |
        go build -o webserver ./example/webserver
        go build -o ebitengine ./example/ebitengine
        go build -o termdoom ./example/termdoom
    - name: Save the test movie outputs
      uses: actions/upload-artifact@v7
      with:
        name: Test Run Movies
        path: doom_test_Test*.mp4
